openapi: '3.0.0'
info:
  version: 1.0.0
  title: Abhishek Kumar
  license:
    name: MIT
servers:
  - url: http://petstore.swagger.io/v1
paths:
  /filings:
    get:
      summary: List all filings
      operationId: listFilings
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: An paged array of filings
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filings'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create filing record
      operationId: createFiling
      responses:
        201:
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /filings/{filingId}:
    get:
      summary: Get filing info
      operationId: showFilingById
      parameters:
        - name: filingId
          in: path
          required: true
          description: The id of the filing to retrieve
          schema:
            type: string
      responses:
        200:
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filings'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Filing:
      required:
        - id
        - form
      properties:
        id:
          type: integer
          format: int64
        form:
          type: string
        filedDate:
          type: string
        cik:
          type: string
        url:
          type: string
    Filings:
      type: array
      items:
        $ref: '#/components/schemas/Filing'
    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string